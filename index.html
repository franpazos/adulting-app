<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!--
      theme-color paints Android's status bar (and Chrome's toolbar when
      browsed as a tab). Match it to the app surface per color scheme so the
      strip blends into the UI instead of showing as a violet band. iOS
      ignores this meta — it uses apple-mobile-web-app-status-bar-style below.
    -->
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F16" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Adulting" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Local-first finance for households of two — calm, premium, effortless."
    />
    <title>Adulting.app</title>
    <!-- Google Identity Services — provides window.google.accounts for OAuth.
         Loaded async/defer so it doesn't block app boot. The auth layer in
         src/lib/google/auth.ts waits for window.google before issuing requests. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
